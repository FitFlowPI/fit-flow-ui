<div class="create-chart-container">

<!--  TODO botao voltar -->
<!--  TODO botao excluir que vira cancelar quando edita -->
  <h2 class="title"> {{seriesName}} </h2>


  <div class="form">
    <div class="input-container series-name">
      <label for="series-name">Nome da Série</label>
      <input
        pInputText
        id="series-name"
        aria-describedby="series-name-help"
        [(ngModel)]="seriesName" />
    </div>
    <div *ngIf="isMobile" class="input-container exercise-name">
      <label for="exercise-name">Nome do Exercício</label>
      <input
        pInputText
        id="exercise-name"
        aria-describedby="exercise-name-help"
        [(ngModel)]="newExercise.name" />
    </div>
    <div *ngIf="isMobile" class="numbers">
      <div class="input-container">
        <label for="series">Séries</label>
        <p-inputNumber
          type="number"
          [inputStyle]="{'text-align':'center', 'width':'100%', 'min-width': '3rem'}"
          [(ngModel)]="newExercise.series"
          [showButtons]="true"
          [buttonLayout]="'horizontal'"
          id="series"
          inputId="series"
          [min]="0"
          [max]="10"
          [step]="1"
          decrementButtonClass="p-button-contrast"
          incrementButtonClass="p-button-contrast"
          incrementButtonIcon="pi pi-plus"
          decrementButtonIcon="pi pi-minus"
          name="series"
          placeholder="Séries"
          class="input-contrast"
        />
      </div>
      <div class="input-container">
        <label for="repetitions">Repetições</label>
        <p-inputNumber
          type="number"
          [inputStyle]="{'text-align':'center', 'width':'100%', 'min-width': '3rem'}"
          [(ngModel)]="newExercise.repetitions"
          [showButtons]="true"
          [buttonLayout]="'horizontal'"
          id="repetitions"
          inputId="repetitions"
          [min]="0"
          [max]="10"
          [step]="1"
          decrementButtonClass="p-button-contrast"
          incrementButtonClass="p-button-contrast"
          incrementButtonIcon="pi pi-plus"
          decrementButtonIcon="pi pi-minus"
          name="series"
          placeholder="Séries"
          class="input-contrast"
        />
      </div>
    </div>
    <div *ngIf="isMobile" class="button-add-container">
      <app-button
        (click)="addNewExercise()"
        [colors]="['#1de2ff', '#d200ff']"
        [wrapContent]="false"
        gap="10px"
        width="100%"
        id="b-mobile-chart-submit" >
        Adicionar
        <fa-icon [icon]="faAdd"></fa-icon>
      </app-button>
    </div>
  </div>

  <p-table #table [value]="exercises" dataKey="id" editMode="row" [ngStyle]="{'width': isMobile ? '100%' : 'auto', 'flex-shrink': '0'}">
    <ng-template pTemplate="header">
      <tr>
        <th *ngIf="showId" style="width:10%; text-align:center">ID</th>
        <th style="width:50%">Nome</th>
        <th style="width:10%; text-align:center">Séries</th>
        <th style="text-align:center; padding: 0">Repetições</th>
        <th></th>
      </tr>
      <tr *ngIf="!isMobile" class="table-input">
        <th *ngIf="showId" style="font-weight: 600; color: white; text-align:center">
          {{ exercises.length + 1}}
        </th>
        <th>
          <input
            pInputText
            type="text"
            [(ngModel)]="newExercise.name"
            name="name"
            placeholder="Nome"
            class="input-contrast"
            style="width: 100%; max-width: 100%; min-width: 8rem"
            #nameInput="ngModel"
          />
        </th>
        <th>
          <div style="display: flex; justify-content: center; align-items: center; width: 100%; height: 100%;">
            <p-inputNumber
              type="number"
              [inputStyle]="{'width': '3rem', 'text-align':'center'}"
              [(ngModel)]="newExercise.series"
              [showButtons]="true"
              [buttonLayout]="numberInputLayout"
              inputId="series"
              [min]="0"
              [max]="10"
              [step]="1"
              decrementButtonClass="p-button-contrast"
              incrementButtonClass="p-button-contrast"
              incrementButtonIcon="pi pi-plus"
              decrementButtonIcon="pi pi-minus"
              name="series"
              placeholder="Séries"
              class="input-contrast"
              #seriesInput="ngModel"
            />
          </div>
        </th>
        <th>
          <div style="display: flex; justify-content: center; align-items: center; width: 100%; height: 100%;">
            <p-inputNumber
              type="number"
              [inputStyle]="{'width': '3rem', 'text-align':'center'}"
              [(ngModel)]="newExercise.repetitions"
              [showButtons]="true"
              [buttonLayout]="numberInputLayout"
              inputId="repetitions"
              [min]="0"
              [max]="10"
              [step]="1"
              decrementButtonClass="p-button-contrast"
              incrementButtonClass="p-button-contrast"
              incrementButtonIcon="pi pi-plus"
              decrementButtonIcon="pi pi-minus"
              placeholder="Repetições"
              class="input-contrast"
              #repetitionsInput="ngModel"
            />
          </div>
        </th>
        <th style="padding: 0">
          <button
            pButton
            pRipple
            style="align-self: center"
            type="button"
            icon="pi pi-plus"
            class="p-button-rounded p-button-text add-button"
            (click)="addNewExercise()"
            [disabled]="nameInput.invalid || seriesInput.invalid || repetitionsInput.invalid"
          >
          </button>
        </th>
      </tr>
    </ng-template>

    <ng-template pTemplate="body" let-exercise let-editing="editing" let-ri="rowIndex">
      <tr [pEditableRow]="exercise">
        <td *ngIf="showId" style="text-align:center;">
          {{ exercise.id }}
        </td>
        <td>
          <p-cellEditor>
            <ng-template pTemplate="input">
              <input
                pInputText type="text"
                style="width: 100%; max-width: 100%;"
                [(ngModel)]="exercise.name" />
            </ng-template>
            <ng-template pTemplate="output">
              {{exercise.name}}
            </ng-template>
          </p-cellEditor>
        </td>
        <td style="text-align:center;">
          <p-cellEditor>
            <ng-template pTemplate="input">
              <p-inputNumber
                type="number"
                [inputStyle]="{'width': '3rem', 'text-align':
                'center'}"
                [style]="{'align-self': 'center'}"
                [(ngModel)]="exercise.series"
                [showButtons]="true"
                [buttonLayout]="numberInputLayout"
                inputId="series-edit"
                [min]="0"
                [max]="10"
                [step]="1"
                decrementButtonClass="p-button-contrast"
                incrementButtonClass="p-button-contrast"
                incrementButtonIcon="pi pi-plus"
                decrementButtonIcon="pi pi-minus"
                class="input-contrast"
              />
            </ng-template>
            <ng-template pTemplate="output">
              {{exercise.series}}
            </ng-template>
          </p-cellEditor>
        </td>
        <td style="text-align:center;">
          <p-cellEditor>
            <ng-template pTemplate="input">
              <p-inputNumber
                type="number"
                [inputStyle]="{'width': '3rem', 'text-align':'center'}"
                [style]="{'align-self': 'center'}"
                [(ngModel)]="exercise.repetitions"
                [showButtons]="true"
                [buttonLayout]="numberInputLayout"
                inputId="repetitions-edit"
                [min]="0"
                [max]="10"
                [step]="1"
                decrementButtonClass="p-button-contrast"
                incrementButtonClass="p-button-contrast"
                incrementButtonIcon="pi pi-plus"
                decrementButtonIcon="pi pi-minus"
              />
            </ng-template>
            <ng-template pTemplate="output">
              {{exercise.repetitions}}
            </ng-template>
          </p-cellEditor>
        </td>
        <td style="padding: 0">
          <div class="flex align-items-center justify-content-center gap-2">
            <button
              *ngIf="!editing"
              pButton
              pRipple
              type="button"
              pInitEditableRow
              icon="pi pi-pencil"
              (click)="onRowEditInit(exercise)"
              class="p-button-rounded p-button-text edit-button">
            </button>
            <button
              *ngIf="editing"
              pButton
              pRipple
              type="button"
              pSaveEditableRow
              icon="pi pi-check"
              (click)="onRowEditSave(exercise)"
              class="p-button-rounded p-button-text p-button-success confirm-button mr-2">
            </button>
            <button
              *ngIf="editing"
              pButton pRipple
              type="button"
              pCancelEditableRow
              icon="pi pi-times"
              (click)="onRowEditCancel(exercise, ri)"
              class="p-button-rounded p-button-text p-button-danger cancel-button">
            </button>
          </div>
        </td>
      </tr>
    </ng-template>
  </p-table>
  <div class="submit-button-container">
    <app-button *ngIf="exercises.length > 0" [colors]="['#278000', '#01b081']" style="align-self: end" id="b-chart-submit" (click)="submit()"> Enviar </app-button>
  </div>
</div>
