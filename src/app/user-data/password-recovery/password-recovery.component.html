<div class="form-card compact">
  <h2 class="title">
    <a [routerLink]="['/user', 'login']" class="return-button"> ◀ </a>Recuperação
  </h2>

  <div class="header">
    <h2> Esqueceu sua senha? </h2>
    <span>
      Por favor digite seu email na caixa de texto abaixo para lhe enviar-mos o link de recuperação de senha
    </span>
  </div>

  <div class="form-container">
    <form [formGroup]="passwordRecoveryForm" (ngSubmit)="onSubmit()">
      <div class="flex flex-column gap-2">
        <label for="email">Digite seu email</label>
        <input
          formControlName="email"
          class="input-contrast rounded"
          pInputText
          id="email"
          placeholder="Seu email"
        />
        <div *ngIf="email.invalid && email.touched" class="error-message">
          <small *ngIf="email.errors?.['required']">O email é obrigatório.</small>
          <small *ngIf="email.errors?.['email']">Insira um email válido.</small>
        </div>
      </div>
    </form>
  </div>
  <app-button
    id="b-register"
    class="app-button"
    [disabled]="passwordRecoveryForm.invalid"
    (click)="onSubmit()"
  >
    Continuar
  </app-button>
</div>
